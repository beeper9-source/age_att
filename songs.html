<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>연습곡 관리 - Reina</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎵 연습곡 관리</h1>
        </header>

        <nav class="main-nav">
            <a href="index.html" class="nav-item">홈</a>
            <a href="members.html" class="nav-item">단원 관리</a>
            <a href="schedule.html" class="nav-item">연습일 관리</a>
            <a href="songs.html" class="nav-item active">연습곡 관리</a>
            <a href="attendance.html" class="nav-item">출석 체크</a>
            <a href="attendance_stats.html" class="nav-item">출석 통계</a>
            <a href="attendance_matrix.html" class="nav-item">출석 매트릭스</a>
        </nav>

        <main>
            <div class="page-header">
                <button class="btn btn-primary" id="addSongBtn">+ 연습곡 추가</button>
            </div>

            <div class="songs-list" id="songsList">
                <!-- 연습곡 목록이 여기에 동적으로 로드됩니다 -->
            </div>
        </main>

        <!-- 연습곡 추가/수정 모달 -->
        <div id="songModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2 id="modalTitle">연습곡 추가</h2>
                <form id="songForm">
                    <input type="hidden" id="songId">
                    
                    <div class="form-group">
                        <label for="songTitle">곡명 *</label>
                        <input type="text" id="songTitle" required>
                    </div>

                    <div class="form-group">
                        <label for="songComposer">작곡가</label>
                        <input type="text" id="songComposer">
                    </div>

                    <div class="form-group">
                        <label for="songArranger">편곡가</label>
                        <input type="text" id="songArranger">
                    </div>

                    <div class="form-group">
                        <label for="songMemo">메모</label>
                        <textarea id="songMemo" rows="4"></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">저장</button>
                        <button type="button" class="btn btn-secondary" id="cancelBtn">취소</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
    <script type="module" src="songs.js"></script>
</body>
</html>
